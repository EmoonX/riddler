{% set no_navbar = True %}
{% extends 'layout.htm' %}
{% block title %}Sign Up ⬩ Riddler{% endblock %}
{% block extra %}
    <script src="/static/scripts/settings.js"></script>
{% endblock %}
{% block content %}
    <main>
      <h1>Sign Up</h1>
      <form method="post">
        <fieldset>
          <legend>Personal info</legend>
          <div>
            <label>
              <span class="icon-wrapper">
                <img src="/static/icons/discord.png" width="24">
                Discord username
              </span>
              <input type="text" name="discord_username" value="{{ user.name }}" readonly>
            </label>
            <label>
              Country
              <select name="country" required>
                <option disabled>-- Choose your country --</option>
              {% for short_name, alpha_2 in get_sorted_countries() %}
                <option value="{{ alpha_2 }}">{{ short_name }}</option>
              {% endfor %}
              </select>
            </label>
            <figure class="flag">
              <img alt="">
            </figure>
          </div>
        </fieldset>
        <input type="submit" value="Create account">
      </form>
      <footer>{{ msg }}</footer>
    </main>
{% endblock %}
